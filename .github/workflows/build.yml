name: Compilar OptimizadorFrankenn
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish OptimizadorFrankenn.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./release
      - uses: actions/upload-artifact@v4
        with:
          name: OptimizadorFrankenn-EXE
          path: ./release/OptimizadorFrankenn.exe
